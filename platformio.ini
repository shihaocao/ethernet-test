; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Pico 2W is not in platformio/raspberrypi. The board file and the
; Earle Philhower core come from this fork:
; https://github.com/earlephilhower/arduino-pico/blob/master/docs/platformio.rst

[platformio]
default_envs = blink

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; Each env under src/targets/ is one firmware. Shared sources stay in src/.
; phy/ and net/ are the 10BASE-T transmitter and the frame builder.
[env:blink]
build_src_filter = +<*> -<targets/> -<phy/> -<net/> +<targets/blink.cpp>

; 120 MHz divides the 20 MHz Manchester clock and the 60 MHz RX sampler.
[env:ping]
board_build.f_cpu = 120000000L
build_src_filter = +<*> -<targets/> +<targets/ping.cpp>

[env:echo]
board_build.f_cpu = 120000000L
build_src_filter = +<*> -<targets/> +<targets/echo.cpp>
